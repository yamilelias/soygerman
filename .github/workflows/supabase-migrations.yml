name: Deploy Supabase migrations

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as secrets in the Production environment."
            exit 1
          fi

      - name: Verify IPv4 pooler URL
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_DB_URL", "")
          if not url:
              raise SystemExit("::error::Configure SUPABASE_DB_URL in the Production environment.")

          connection = urlparse(url)
          if (
              connection.scheme not in ("postgres", "postgresql")
              or not (connection.hostname or "").endswith(".pooler.supabase.com")
              or connection.port != 5432
              or connection.username != "postgres.nbwxmkcwzqqxvxxfqqpn"
              or connection.path != "/postgres"
              or not connection.password
              or connection.password == "[YOUR-PASSWORD]"
          ):
              raise SystemExit("::error::SUPABASE_DB_URL must be the SoyGerman Session pooler URL on port 5432.")
          PY

      - name: Link production project
        run: supabase link --project-ref nbwxmkcwzqqxvxxfqqpn

      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
